<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best Credit Card Finder</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
 form{display:flex;gap:.5rem} input{flex:1;padding:.7rem;font-size:1rem;border:1px solid #bbb;border-radius:6px}
 button{padding:.7rem 1.2rem;font-size:1rem;border:0;border-radius:6px;background:#1a56db;color:#fff;cursor:pointer}
 .best{margin:1.5rem 0 .5rem;padding:1rem;border-radius:8px;background:#eef4ff;border:1px solid #c7d8ff}
 .best h2{margin:0 0 .3rem} .muted{color:#666;font-size:.9rem}
 table{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.92rem}
 td,th{padding:.4rem;border-bottom:1px solid #eee;text-align:left}
 .low{color:#b45309} .medium{color:#4b5563} .high{color:#047857}
 .warn{margin-top:1.5rem;font-size:.85rem;color:#7a5a00;background:#fff8e1;padding:.7rem;border-radius:6px}
</style></head><body>
<h1>Best credit card for your purchase</h1>
<form id="f"><input id="q" placeholder="e.g. Rs 5000 petrol at HPCL, 50000 at Tanishq, 30k on Amazon" autofocus><button>Find</button></form>
<div id="out"></div>
<div class="warn">Data is collected from public sources and mostly unverified. Rates and offers change; confirm on the bank's website before applying.</div>
<script>
const out=document.getElementById('out');
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault(); const q=document.getElementById('q').value.trim(); if(!q)return;
  out.textContent='Searching...';
  const r=await fetch('/recommend?q='+encodeURIComponent(q)); const d=await r.json();
  if(d.error){out.innerHTML='<p>'+d.error+'</p>';return}
  if(d.info){out.innerHTML='<pre style="white-space:pre-wrap;font-family:inherit">'+d.info.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre>';return}
  const b=d.results[0];
  const rows=d.results.slice(1).map(x=>`<tr><td>${x.name}</td><td>₹${x.value.toLocaleString('en-IN')}</td><td class="${x.confidence}">${x.confidence}</td><td>${x.fee??'-'}</td><td>${x.reason}</td></tr>`).join('');
  out.innerHTML=`<div class="best"><h2>${b.name}</h2>
   <div>About <b>₹${b.value.toLocaleString('en-IN')}</b> back on ₹${d.purchase.amount.toLocaleString('en-IN')} (${b.reason})</div>
   <div class="muted">Annual fee: ${b.fee??'unknown'} · Data confidence: <span class="${b.confidence}">${b.confidence}</span>${b.offer?' · Offer: '+b.offer:''}</div>
   <div class="muted">${b.benefit||''}</div></div>
   <div class="muted">Understood as: ${d.purchase.category}${d.purchase.merchant?' at '+d.purchase.merchant:''}</div>
   <h3>Other options</h3><table><tr><th>Card</th><th>Value</th><th>Confidence</th><th>Fee</th><th>Why</th></tr>${rows}</table>`;
};
</script></body></html>
