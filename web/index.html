<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best Credit Card Finder</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
 #log{display:flex;flex-direction:column;gap:.6rem;margin:1rem 0;min-height:4rem}
 .msg{padding:.7rem .9rem;border-radius:10px;white-space:pre-wrap;line-height:1.4}
 .me{align-self:flex-end;background:#1a56db;color:#fff} .bot{align-self:flex-start;background:#f1f3f5}
 form{display:flex;gap:.5rem} input{flex:1;padding:.7rem;font-size:1rem;border:1px solid #bbb;border-radius:6px}
 button{padding:.7rem 1.2rem;font-size:1rem;border:0;border-radius:6px;background:#1a56db;color:#fff;cursor:pointer}
 .warn{margin-top:1.5rem;font-size:.85rem;color:#7a5a00;background:#fff8e1;padding:.7rem;border-radius:6px}
</style></head><body>
<h1>Best credit card for your purchase</h1>
<div id="log"><div class="msg bot">Tell me what you're buying and roughly how much, e.g. "Rs 5000 petrol at HPCL" or "flight ticket 50000".</div></div>
<form id="f"><input id="q" placeholder="Type here..." autofocus autocomplete="off"><button>Send</button></form>
<div class="warn">Data is collected from public sources and mostly unverified. Rates and offers change; confirm on the bank's website before applying.</div>
<script>
const log=document.getElementById('log'), q=document.getElementById('q');
const sid=localStorage.sid||(localStorage.sid=Math.random().toString(36).slice(2));
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.appendChild(d);d.scrollIntoView();return d}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault(); const t=q.value.trim(); if(!t)return; q.value=''; add(t,'me');
  const w=add('...','bot');
  try{const r=await fetch('/chat?sid='+sid+'&q='+encodeURIComponent(t)); w.textContent=(await r.json()).reply}
  catch(err){w.textContent='Could not reach the server.'}
};
</script></body></html>
